<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Fruit Finder Christchurch</title>

    <!-- GOOGLE FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- LEAFLET CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css"
    />

    <!-- CUSTOM CSS -->
    <link rel="stylesheet" href="css/style.css" />

    <!-- MARKER CLUSTER CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
    />

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
    />
  </head>

  <body>
    <div class="app-container">
      <!-- HEADER -->
      <header class="header">
        <div class="container header-content">
          <!-- LOGO -->
          <div class="logo-section">
            <img
              src="assets/logos/logo.webp"
              alt="Fruit Finder Logo"
              class="logo"
            />
          </div>

          <!-- HEADER NAVIGATIONS -->
          <nav class="header-nav" aria-label="Primary Navigation">
            <a href="#tutorial" class="header-nav-link">
              <img src="assets/icons/video.webp" alt="" aria-hidden="true" />

              <span>
                Learn How to Use <br />
                Fruit Finder Map
              </span>
            </a>

            <button
              id="disclaimerButton"
              class="header-nav-link disclaimer-link"
              type="button"
              aria-label="Disclaimer and Privacy Notice"
            >
              <img src="assets/icons/shield.webp" alt="" aria-hidden="true" />
            </button>
          </nav>
        </div>
      </header>

      <!-- MAIN -->
      <main class="container main-layout">
        <!-- SIDEBAR -->
        <aside class="sidebar is-collapsed">
          <!-- BOTTOM SHEET HEADER -->

          <div class="legend-sheet-header">
            <div class="sheet-handle"></div>

            <button
              id="legendToggle"
              aria-expanded="false"
              aria-controls="legendCategories"
            >
              <span id="fruitLegendTitle">Fruit Legend</span>

              <img
                id="legendChevron"
                src="assets/icons/chevronup.webp"
                alt="Toggle Fruit Legend"
              />
            </button>
          </div>

          <!-- CATEGORY OVERVIEW -->

          <div id="legendCategories">
            <!-- CATEGORY CARDS GENERATED HERE -->
          </div>
        </aside>

        <!-- MAP SECTION -->
        <section class="map-section">
          <!-- SEARCH -->
          <div class="search-container">
            <input
              type="text"
              id="search-input"
              placeholder="Find Fruit Trees, Information and Location"
            />

            <button
              id="searchButton"
              type="button"
              aria-label="Search Fruit Trees"
            >
              <img src="assets/icons/search.webp" alt="" aria-hidden="true" />
            </button>
          </div>

          <!-- MAP -->
          <div id="map"></div>
        </section>
      </main>

      <!-- FOOTER -->
      <footer class="footer">
        <div class="footer-content">
          <div class="footer-column footer-brand">
            <img
              src="assets/logos/logo.webp"
              alt="Fruit Finder Logo"
              class="footer-logo"
            />

            <div class="footer-brand-text">
              <h2>Fruit Finder</h2>
              <p>Christchurch, NZ</p>
            </div>
          </div>

          <div class="footer-column footer-project">
            <p>© 2026 Fruit Finder</p>
            <p>BCDE211 Project @Ara</p>
          </div>

          <div class="footer-column footer-developer">
            <p>Developed by</p>
            <p>Sunil Kafley</p>
          </div>
        </div>
      </footer>
    </div>

    <!-- LEAFLET JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- LEAFLET ROUTING MACHINE -->

    <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>

    <!-- MARKER CLUSTER JS -->
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <!-- APP JS -->
    <script type="module" src="src/app.js"></script>
  </body>
</html>
